name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version semver sans v (ex: 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.version }}".TrimStart("v", "V")
          } else {
            $v = "${{ github.ref_name }}".TrimStart("v", "V")
          }
          if (-not ($v -match '^\d+\.\d+\.\d+')) { throw "Version invalide: $v" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version=$v"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          powershell -File tools/build-installer.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Karu-Setup-${{ steps.ver.outputs.version }}
          path: artifacts/installer/Karu-Setup-*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Karu ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: artifacts/installer/Karu-Setup-*.exe
          body: |
            ## Installation Windows

            1. Télécharge **Karu-Setup-${{ steps.ver.outputs.version }}.exe**
            2. Lance le setup (assistant clair en français)
            3. Ouvre **Karu** depuis le Bureau / menu Démarrer

            ### Prérequis
            - Windows 10/11 64 bits
            - GPU **NVIDIA** + drivers à jour
            - Valorant en *Plein écran fenêtré* recommandé

            ### SmartScreen
            Si Windows bloque le fichier : *Informations complémentaires* → *Exécuter quand même*
            (binaire non signé Authenticode pour l’instant).
