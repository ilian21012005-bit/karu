name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version semver sans v (ex: 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.version }}".TrimStart("v", "V")
          } else {
            $v = "${{ github.ref_name }}".TrimStart("v", "V")
          }
          if (-not ($v -match '^\d+\.\d+\.\d+')) { throw "Version invalide: $v" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version=$v"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          powershell -File tools/build-installer.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $setup = Get-ChildItem artifacts/installer/Karu-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw "Setup exe not found" }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($setup.Name)" | Set-Content -Path "$($setup.FullName).sha256" -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Karu-Setup-${{ steps.ver.outputs.version }}
          path: |
            artifacts/installer/Karu-Setup-*.exe
            artifacts/installer/Karu-Setup-*.exe.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Karu ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/installer/Karu-Setup-*.exe
            artifacts/installer/Karu-Setup-*.exe.sha256
          body: |
            ## Installation Windows

            1. Télécharge **Karu-Setup-${{ steps.ver.outputs.version }}.exe**
            2. Télécharge aussi **Karu-Setup-${{ steps.ver.outputs.version }}.exe.sha256**
            3. Compare l’empreinte SHA-256 du setup avec le fichier `.sha256` (voir les instructions dans le README)
            4. Lance le setup (assistant en français), puis ouvre **Karu** depuis le Bureau / menu Démarrer

            ### Prérequis
            - Windows 10/11 64 bits
            - GPU **NVIDIA** + drivers à jour
            - Valorant en *Plein écran fenêtré* recommandé

            ### SmartScreen
            L’installateur n’est pas signé Authenticode. SmartScreen peut donc afficher un avertissement même si l’empreinte correspond. Vérifie que tu as téléchargé les deux fichiers depuis cette release officielle avant de continuer. L’empreinte vérifie que le setup correspond au fichier publié avec cette release; elle ne constitue pas une signature de l’éditeur.
